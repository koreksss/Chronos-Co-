# Перенаправление HTTP на HTTPS
server {
    listen 80;
    server_name chronosco.localhost;

    return 301 https://$host$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl;
    server_name chronosco.localhost;

    ssl_certificate /etc/nginx/certs/chronosco.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/chronosco.localhost-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Сжатие ответов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # API-запросы направляются в Flask
    location /api/ {
        proxy_pass http://backend:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальные запросы направляются во frontend
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}