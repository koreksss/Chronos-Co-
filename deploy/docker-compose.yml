services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: chronosco-frontend-prod
    restart: unless-stopped
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - chronosco-network

  backend:
    build:
      context: ../../ChronosCo Backend
      dockerfile: dockerfile
    container_name: chronosco-backend-prod
    restart: unless-stopped
    env_file:
      - ../../ChronosCo Backend/.env
    networks:
      - chronosco-network

  nginx:
    image: nginx:alpine
    container_name: chronosco-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - chronosco-network

networks:
  chronosco-network:
    driver: bridge